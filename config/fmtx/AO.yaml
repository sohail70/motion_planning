experiment:
  name: "AO_test"          # ← must be exactly this string
  planner_type: "KinodynamicFMTX"
  state_space_type: "RDT"
  manager_type: "R2T"

simulation:
  time_budget: 0.0
  duration_limit: 1000000
  slice_time: 0.05
  seed: 42

robot:
  start_state: [48.0, 48.0]
  goal_state:  [-48.0, -48.0]
  dimensions: 2
  bounds_min: [-50.0, -50.0]
  bounds_max: [50.0, 50.0]

planner_params:
  num_of_samples: 1000        # ignored in AO test (overridden)
  factor: 2.0
  kdtree_type: "NanoFlann"
  partial_update: false
  kd_dim: 2
  is_geometric_mode: true

manager_params:
  vis_frequency_hz: 30

gazebo_params:
  sdf_path: "../sims/static_world_straight_box_circle_10.sdf"
  inflation: 0.0
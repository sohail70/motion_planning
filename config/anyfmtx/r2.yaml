experiment:
  name: "ANYFMTX_R2_Geometric_Test"
  planner_type: "KinodynamicANYFMTX"
  state_space_type: "RDT"
  manager_type: "R2T"

simulation:
  duration_limit: 10
  slice_time: 0.05
  seed: 42

robot:
  start_state: [48.0, 48.0] 
  goal_state:  [-48.0, -48.0]
  dimensions: 2
  bounds_min: [-50.0, -50.0]
  bounds_max: [50.0, 50.0]
  min_velocity: 0.0
  max_velocity: 20.0
  robot_velocity: 10.0

planner_params:
  num_of_samples: 20
  factor: 2.0
  delta: 10.0
  epsilon: 0.1
  kdtree_type: "NanoFlann"
  partial_update: false
  kd_dim: 2
  is_geometric_mode: true

manager_params:
  vis_frequency_hz: 30

gazebo_params:
  sdf_path: "../sims/dynamic_world_straight_box_circle_10.sdf"
  inflation: 0.0
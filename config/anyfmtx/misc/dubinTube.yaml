# Mind the STATIC macro needs to be enabled
experiment:
  name: "RTube_test"
  planner_type: "KinodynamicANYFMTX"
  state_space_type: "RDT"
  manager_type: "R2T"

simulation:
  duration_limit: 100
  time_budget: 30.0
  slice_time: 0.02
  seed: 42

robot:
  start_state: [48.0, 48.0, -0.785] # x, y, theta, time_budget
  goal_state:  [-48.0, -48.0, -2.356] # x, y, theta, time_to_go
  dimensions: 4
  bounds_min: [-50.0, -50.0, -3.14159]
  bounds_max: [50.0, 50.0, 3.14159]
  min_velocity: 2.0
  max_velocity: 20.0
  min_turning_radius: 2.0

planner_params:
  num_of_samples: 10
  factor: 3.0
  delta: 20.0
  epsilon: 0.1
  kdtree_type: "NanoFlann"
  partial_update: false
  kd_dim: 4
  is_geometric_mode: false

manager_params:
  vis_frequency_hz: 30

gazebo_params:
  sdf_path: "../sims/static_world_spatiotemporal_1.sdf"
  # sdf_path: "../sims/static_world_spatiotemporal_5.sdf"
  inflation: 0.0
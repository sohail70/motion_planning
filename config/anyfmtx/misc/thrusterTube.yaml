# Mind the STATIC macro needs to be enabled
experiment:
  name: "RTube_test"
  planner_type: "KinodynamicANYFMTX"
  state_space_type: "RDT"
  manager_type: "R2T"

simulation:
  duration_limit: 100
  time_budget: 20.0
  slice_time: 0.02
  seed: 42

robot:
  start_state: [48.0, 48.0, 0.0, 0.0]
  goal_state:  [-48.0, -48.0, 0.0, 0.0]
  dimensions: 5
  bounds_min: [-50.0, -50.0, -15.0, -15.0]
  bounds_max: [ 50.0,  50.0,  15.0,  15.0]
  min_velocity: 0.0
  max_velocity: 15.0
  max_acceleration: 5.0

planner_params:
  num_of_samples: 10
  factor: 3.0
  delta: 20.0
  epsilon: 0.1
  kdtree_type: "NanoFlann"
  partial_update: false
  kd_dim: 5
  is_geometric_mode: false

manager_params:
  vis_frequency_hz: 30

gazebo_params:
  sdf_path: "../sims/static_world_spatiotemporal_1.sdf"
  # sdf_path: "../sims/static_world_spatiotemporal_5.sdf"
  inflation: 0.0
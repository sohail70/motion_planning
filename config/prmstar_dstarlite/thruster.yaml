experiment:
  name: "PRMSTARDSTARLITE_Thruster_Test"
  planner_type: "KinodynamicPRMStarDStarLite"
  state_space_type: "Thruster"
  manager_type: "Thruster"

simulation:
  time_budget: 30.0
  slice_time: 0.02
  seed: 42

robot:
  # Start: x, y, vx, vy, time_budget
  start_state: [48.0, 48.0, 0.0, 0.0]
  # Goal: x, y, vx, vy, time_to_go
  goal_state:  [-48.0, -48.0, 0.0, 0.0]
  dimensions: 5
  bounds_min: [-50.0, -50.0, -15.0, -15.0]
  bounds_max: [ 50.0,  50.0,  15.0,  15.0]
  min_velocity: 0.0
  max_velocity: 15.0
  max_acceleration: 5.0

planner_params:
  num_of_samples: 1000
  factor: 3.0
  kdtree_type: "NanoFlann"
  partial_update: true
  kd_dim: 5
  is_geometric_mode: false
  num_pillar_nodes: 50
  goal_radius: 0.5

manager_params:
  vis_frequency_hz: 30

gazebo_params:
  sdf_path: "../sims/dynamic_world_straight_box_circle_10_slow.sdf"
  inflation: 0.75
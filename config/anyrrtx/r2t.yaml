experiment:
  name: "RRTX_R2T_Test"
  planner_type: "KinodynamicANYRRTX"
  state_space_type: "RDT"
  manager_type: "R2T"

simulation:
  time_budget: 25.0
  slice_time: 0.02
  seed: 42 #45?!

robot:
  start_state: [48.0, 48.0] # x, y, time_budget (Must match dim)
  goal_state:  [-48.0, -48.0] # x, y, time_to_go
  dimensions: 3 # 2 for R2, 3 for R2T, 4 for Dubins, 5 for Thruster
  bounds_min: [-50.0, -50.0]
  bounds_max: [50.0, 50.0]
  min_velocity: 0.0
  max_velocity: 20.0

planner_params:
  num_of_samples: 3
  factor: 3.0
  delta: 25.0
  epsilon: 0.1
  kdtree_type: "NanoFlann"
  partial_update: false
  kd_dim: 3 # 3 for R2T
  is_geometric_mode: false
  num_pillar_nodes: 0
  goal_radius: 0.5


manager_params:
  vis_frequency_hz: 30

gazebo_params:
  sdf_path: "../sims/dynamic_world_straight_box_circle_20_r2t.sdf"
  # sdf_path: "../sims/static_dynamic_world_straight_box_circle_11.sdf"
  inflation: 1.0